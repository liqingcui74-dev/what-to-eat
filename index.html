<html lang="zh-CN">

  <title>今天吃什么？</title>

</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">
      <h1>今天吃什么？</h1>
      <p>不纠结了，交给随机按钮 🍚</p>
    </div>
    <div class="emoji">🥢</div>
  </div>

  <div class="hero">
    <div class="small">✨ 懒得想就用这个</div>
    <h2>一键生成今日三餐</h2>
    <p>早餐、午餐、晚餐一次安排好，都是家常口味。</p>
    <button onclick="generateDay()">帮我决定今天吃什么</button>
  </div>

  <div class="install" id="installBox">
    <div><b>安装到手机桌面</b><span>以后像 App 一样一键打开</span></div>
    <button id="installBtn">安装</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-type="breakfast" onclick="switchType('breakfast')">早餐</button>
    <button class="tab" data-type="lunch" onclick="switchType('lunch')">午餐</button>
    <button class="tab" data-type="dinner" onclick="switchType('dinner')">晚餐</button>
  </div>

  <div class="card">
    <div class="meal-label" id="mealLabel">今天早餐吃：</div>
    <div class="dish">
      <div>
        <h3 id="dishName">番茄鸡蛋面</h3>
        <p id="dishDesc">快手 · 热乎 · 15分钟</p>
      </div>
      <div class="dish-emoji" id="dishEmoji">🍜</div>
    </div>
    <div class="actions">
      <button class="btn primary" onclick="randomDish()">换一个</button>
      <button class="btn secondary" onclick="openRecipe()">看菜谱</button>
    </div>
  </div>

  <div class="section-title"><span>最近抽到</span><span class="tiny">点菜名可看菜谱</span></div>
  <div class="history" id="history"></div>

  <div class="tip">💡 小规则：同一餐会尽量避开你刚刚抽到过的菜。真不知道吃啥的时候，就不要反悔，第一抽直接吃。</div>
</div>

<div class="modal" id="recipeModal" onclick="closeOnBg(event)">
  <div class="sheet">
    <div class="sheet-top"><h2 id="recipeTitle"></h2><button class="close" onclick="closeRecipe()">×</button></div>
    <div class="tagline" id="recipeDesc"></div>
    <div class="recipe-block"><h4>🧺 食材</h4><ul id="ingredients"></ul></div>
    <div class="recipe-block"><h4>👩🏻‍🍳 做法</h4><ol id="steps"></ol></div>
  </div>
</div>

<div class="modal" id="dayModal" onclick="closeDayOnBg(event)">
  <div class="sheet">
    <div class="sheet-top"><h2>今日三餐</h2><button class="close" onclick="closeDay()">×</button></div>
    <div class="tagline">今天就按这个吃，拒绝选择困难。</div>
    <div class="today-list" id="todayList"></div>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="generateDay()">整套换一套</button>
  </div>
</div>

let type="breakfast";
let current=data.breakfast[0];
let history=JSON.parse(localStorage.getItem("mealHistory")||"[]");
const labels={breakfast:"今天早餐吃：",lunch:"今天午餐吃：",dinner:"今天晚餐吃："};

function switchType(t){
  type=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===t));
  randomDish();
}
function randomDish(){
  const list=data[type];
  const recentNames=history.slice(0,4).map(x=>x.name);
  let pool=list.filter(x=>!recentNames.includes(x.name));
  if(!pool.length) pool=list;
  current=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById("mealLabel").textContent=labels[type];
  document.getElementById("dishName").textContent=current.name;
  document.getElementById("dishDesc").textContent=current.desc;
  document.getElementById("dishEmoji").textContent=current.emoji;
  addHistory(current,type);
}
function addHistory(d,t){
  history=history.filter(x=>!(x.name===d.name&&x.type===t));
  history.unshift({name:d.name,type:t,emoji:d.emoji});
  history=history.slice(0,6);
  localStorage.setItem("mealHistory",JSON.stringify(history));
  renderHistory();
}
function renderHistory(){
  const box=document.getElementById("history");
  if(!history.length){box.innerHTML='<div class="empty">还没有记录，先抽一道吧。</div>';return}
  box.innerHTML=history.map((h,i)=>`<div class="history-item" onclick="openHistory(${i})"><div><b>${h.emoji} ${h.name}</b></div><span>${h.type==="breakfast"?"早餐":h.type==="lunch"?"午餐":"晚餐"} ›</span></div>`).join("");
}
function findDish(name,t){return data[t].find(x=>x.name===name)}
function openHistory(i){
  const h=history[i],d=findDish(h.name,h.type); if(!d)return;
  current=d;type=h.type;showRecipe(d);
}
function openRecipe(){showRecipe(current)}
function showRecipe(d){
  document.getElementById("recipeTitle").textContent=d.name;
  document.getElementById("recipeDesc").textContent=d.desc;
  document.getElementById("ingredients").innerHTML=d.ingredients.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("steps").innerHTML=d.steps.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("recipeModal").classList.add("show");
}
function closeRecipe(){document.getElementById("recipeModal").classList.remove("show")}
function closeOnBg(e){if(e.target.id==="recipeModal")closeRecipe()}
function generateDay(){
  const picks=["breakfast","lunch","dinner"].map(t=>({type:t,dish:data[t][Math.floor(Math.random()*data[t].length)]}));
  const names={breakfast:"早餐",lunch:"午餐",dinner:"晚餐"};
  document.getElementById("todayList").innerHTML=picks.map(x=>`<div class="today-row"><div><span>${names[x.type]}</span><br><b>${x.dish.emoji} ${x.dish.name}</b></div><button onclick="showDayRecipe('${x.type}','${x.dish.name.replace(/'/g,"\\'")}')">菜谱</button></div>`).join("");
  document.getElementById("dayModal").classList.add("show");
}
function showDayRecipe(t,name){const d=findDish(name,t);if(d){closeDay();showRecipe(d)}}
function closeDay(){document.getElementById("dayModal").classList.remove("show")}
function closeDayOnBg(e){if(e.target.id==="dayModal")closeDay()}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById("installBox").classList.add("show");
});
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById("installBox").classList.remove("show");
});
window.addEventListener("appinstalled",()=>document.getElementById("installBox").classList.remove("show"));

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
}

renderHistory();
randomDish();
</script>
